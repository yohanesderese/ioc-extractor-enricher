[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-extractor-enricher"
version = "0.1.0"
description = "Offline IOC extraction for CTI and SOC analysts"
requires-python = ">=3.11"
dependencies = [
    "tldextract>=5.1,<6", "httpx>=0.27,<1", "fastapi>=0.115,<1",
    "jinja2>=3.1,<4", "python-multipart>=0.0.20,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
ioc-extract = "ioc_extractor_enricher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ioc_extractor_enricher = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
